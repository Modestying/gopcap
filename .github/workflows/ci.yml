name: CI & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test & Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Verify zero-CGO unit tests
        env:
          CGO_ENABLED: '0'
        run: go test -v ./...

      - name: Run zero-copy decoder benchmark
        env:
          CGO_ENABLED: '0'
        run: go test -bench=BenchmarkZeroCopyDecode -benchmem ./pkg/layers

      - name: Build CLI binary
        env:
          CGO_ENABLED: '0'
        run: |
          go build -o bin/gopcap ./cmd/gopcap
          ./bin/gopcap -gen-demo /tmp/demo.pcap
          ./bin/gopcap -r /tmp/demo.pcap

  release:
    name: Build & Publish Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Cross-compile static binaries (Linux & macOS)
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/gopcap-linux-amd64   ./cmd/gopcap
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/gopcap-linux-arm64   ./cmd/gopcap
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/gopcap-darwin-amd64  ./cmd/gopcap
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/gopcap-darwin-arm64  ./cmd/gopcap
          cd dist && sha256sum gopcap-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/gopcap-linux-amd64
            dist/gopcap-linux-arm64
            dist/gopcap-darwin-amd64
            dist/gopcap-darwin-arm64
            dist/checksums.txt
